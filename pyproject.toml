[project]
name = "papercheck"
version = "0.1.0"
description = "Statistical consistency checks for research papers: statcheck-style p recomputation, GRIM, GRIMMER, df vs N, duplicates."
requires-python = ">=3.10"
dependencies = ["pymupdf>=1.24", "scipy>=1.11", "numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
papercheck = "papercheck.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["papercheck*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
